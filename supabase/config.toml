# Configuración de la CLI de Supabase (solo para desarrollo local y migraciones).
project_id = "biburu"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
# Registro cerrado: solo entran usuarios creados a mano (ver README).
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true
otp_length = 6
otp_expiry = 3600
